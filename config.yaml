# Clip window around a detected event, in seconds
clip:
  pre_seconds: 12          # chances: the commentator reacts after the action
  post_seconds: 6
  goal_pre_seconds: 20     # goals: room for the build-up
  goal_post_seconds: 8
  include_replay: true
  replay_max_seconds: 25   # hidden score bug after a goal = celebration and replays
  max_chances: 15
  snap_seconds: 4          # move clip edges to a camera cut this close

# Final Shorts render settings
output:
  width: 1080
  height: 1920
  layout: wide        # crop = 9:16 window following the ball; wide = 4:5 window following it over
                      # a blurred fill (more players in view); blur = whole 16:9 frame over blur
  encoder: h264_nvenc
  bitrate: 12M
  zoom: 1.0             # 1.0 = full frame height; larger crops tighter around the action
  top_margin: 0.1       # share of frame height at the top kept out of the crop: the score bug strip
  detect_fps: 10        # detector rate along a clip; the crop path is interpolated between
  smooth_seconds: 0.6   # camera smoothing per shot
  min_coverage: 0.5     # share of samples where the ball/players were found, else blur layout
  ball_weights: models/ball/checkpoint_best_total.pth   # our fine-tuned ball detector (fshorts trainball)
  window_aspect: 0.8    # width/height of the followed window in the wide layout (4:5)
  upscaler: realesrgan  # lanczos | realesrgan (sharper, removes compression blocks)
  sr_weights: models/realesr-general-x4v3.pth

# Candidate moment detection (M1)
events:
  merge_seconds: 35        # candidates within this window after the first one collapse into one
  max_candidates: 50
  audio:
    hop_seconds: 0.5
    baseline_seconds: 120  # rolling median window that removes slow loudness drift
    smooth_seconds: 4
    min_gap_seconds: 20
    min_zscore: 2.0
    min_db_rise: 3.0       # peak must also be this much louder than the baseline
  commentary:
    model: large-v3-turbo
    compute_type: float16
    language: null         # null = auto detect
    # regex searched in the lowercased running transcript -> weight
    phrases:
      '\bgo+a+l+\b': 3.0
      '\bgo+l+\b': 3.0
      '\bгол+\b': 3.0
      '\b(scores?|scored)\b': 2.0
      '(?<![\d-])\d\s*-\s*\d(?![\d-])': 2.0       # "it's 1-0" (Whisper writes "1 -0"), not formations like 4-4-2
      '\bequali[sz]': 2.5
      '\b(back in front|in front again|first blood|breakthrough)\b': 2.0
      '\bwhat an? (goal|shot|strike|finish|header|effort)\b': 3.0
      '\b(and in|deflected and in|in it goes|into the net|top corner|bottom corner)\b': 2.0
      '\bstrikes?\b': 1.0
      '\b(genius|exquisite|sensational|stunning|unbelievable|incredible|wonderful|brilliant|magnificent)\b': 1.0
      '\bpenalt(y|ies)\b': 1.5
      '\bпенальт': 1.5
      '\b(saved?|save|denied)\b': 1.0
      '\bfree kick\b': 0.5
      '\b(chance|header|off the post|crossbar|woodwork)\b': 0.5

# Goal confirmation from the on-screen score (M2)
scoreboard:
  fps: 1
  confirmations: 3         # consecutive agreeing readings before a new score is accepted
  min_confidence: 0.3
  region: [0, 0, 1000, 140]  # x, y, width, height on a 1920x1080 frame; covers the top-left score bug

paths:
  matches: data/matches
  outputs: data/outputs
  labels: data/labels/human
